<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valora House| Edit Listing</title>
    <meta
      name="description"
      content="Edit your listing. You can edit title, description, image and tags."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon_io-7/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon_io-7/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon_io-7/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon_io-7/site.webmanifest" />
    <script
      src="https://kit.fontawesome.com/309152690f.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/pages/editListing.js"></script>
  </head>
  <body class="font-manrope grid min-h-screen grid-rows-[auto_1fr_auto]">
    <header id="header"></header>
    <main class="bg-background flex items-center justify-center">
      <div
        class="alert-message text-md fixed top-10 right-10 z-50 hidden rounded-md border px-4 py-2 font-medium"
      ></div>
      <div
        class="mx-4 my-10 w-full max-w-lg rounded-md bg-white p-6 shadow-md md:mx-0 md:max-w-3xl md:p-20"
      >
        <h1
          class="text-header-mobile text-text mb-4 text-center font-semibold md:text-2xl"
        >
          Edit Listing
        </h1>
        <form id="editListingForm">
          <div class="mt-8 flex flex-col gap-1">
            <label class="text-text font-semibold md:text-lg" for="listingTitle"
              >Title</label
            >
            <input
              type="text"
              id="listingTitle"
              name="listingTitle"
              placeholder="Listing title"
              class="border-border text-placeholder focus:outline-accent text-text cursor-pointer rounded-md border px-2 py-3 text-sm"
            />
          </div>
          <div class="mt-3 flex flex-col gap-1">
            <label
              class="text-text font-semibold md:text-lg"
              for="listingDescription"
              >Description</label
            >
            <textarea
              id="listingDescription"
              name="listingDescription"
              placeholder="Listing description"
              class="border-border text-placeholder focus:outline-accent text-text cursor-pointer rounded-md border px-2 py-3 text-sm"
            ></textarea>
          </div>
          <div id="imageInputContainer">
            <div class="mt-3 flex flex-col gap-1">
              <label
                for="listingImage"
                class="text-text font-semibold md:text-lg"
                >Image URL</label
              >
              <input
                type="url"
                id="listingImage"
                name="listingImage"
                placeholder="Image URL"
                class="border-border text-placeholder focus:outline-accent text-text cursor-pointer rounded-md border px-2 py-3 text-sm md:text-base"
              />
            </div>
          </div>
          <div class="has-tooltip relative mt-3 flex justify-end">
            <i
              id="addImageButton"
              class="fa-regular fa-image text-accent cursor-pointer text-2xl"
            ></i>
            <span
              class="bg-primary tooltip top-full rounded-md px-2 py-1 text-sm text-white"
              >Add image</span
            >
          </div>
          <div class="mt-3 flex flex-col gap-1">
            <label for="tags" class="text-text font-semibold md:text-lg"
              >Tags</label
            >
            <input
              type="text"
              id="tags"
              name="tags"
              placeholder="Enter tags separated by commas"
              class="border-border text-placeholder focus:outline-accent text-text cursor-pointer rounded-md border px-2 py-3 text-sm md:text-base"
            />
          </div>
          <div class="mt-8 flex gap-2">
            <button
              type="submit"
              class="bg-accent hover:from-accent hover:to-accent-hover w-full cursor-pointer rounded-md from-transparent to-transparent px-3 py-3 text-lg text-white hover:bg-linear-to-r md:w-auto"
            >
              Submit changes
            </button>
            <button
              type="button"
              id="cancelEdit"
              class="border-accent text-accent hover:to-accent-hover hover:from-accent w-full cursor-pointer rounded-md border bg-white px-2 py-3 text-lg hover:bg-linear-to-r hover:text-white md:w-auto md:px-8"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer class="bg-primary py-6 text-white">
      <div class="flex flex-col items-center text-center">
        <h2 class="mb-4 text-sm md:mb-6 md:text-base">CONTACT US</h2>
        <div
          class="text-cs flex flex-col items-center gap-2 md:flex-row md:gap-6"
        >
          <p class="mb-2 flex items-center gap-2 text-xs text-white md:text-sm">
            <i class="fa-solid fa-phone"></i>23 02 03 31
          </p>
          <p class="mb-2 flex items-center gap-2 text-xs text-white md:text-sm">
            <i class="fa-solid fa-envelope"></i>service@valorahouse.com
          </p>
          <p class="mb-2 flex items-center gap-2 text-xs text-white md:text-sm">
            <i class="fa-solid fa-location-dot"></i>Kongens gate 23, 0250 Oslo
          </p>
        </div>
        <img
          class="h-16 w-16 md:mt-4 md:h-20 md:w-20"
          alt="Valora-house logo"
          src="./images/logo-footer-black.png"
        />
      </div>
    </footer>
  </body>
</html>
