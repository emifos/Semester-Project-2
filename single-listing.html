<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valora House | Single listing</title>
    <meta
      name="description"
      content="This is the single listing page. Here you can view details of a listing and place a bid if you are logged in. You can also see the bidding history."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io-7/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io-7/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon_io-7/favicon-16x16.png"
    />
    <script
      src="https://kit.fontawesome.com/309152690f.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="favicon_io-7/site.webmanifest" />
    <script type="module" src="js/pages/listingDetail.js"></script>
  </head>
  <body class="font-manrope grid min-h-screen grid-rows-[auto_1fr_auto]">
    <header id="header"></header>
    <main class="bg-background">
      <div
        class="alert-message text-md fixed top-10 right-10 z-50 hidden rounded-md border px-4 py-2 font-medium"
      ></div>
      <div
        id="confirmModal"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50"
      >
        <div class="flex h-full w-full items-center justify-center">
          <div class="w-110 rounded-md bg-white p-15 shadow-md">
            <p class="text-text">
              Are you sure you want to delete the listing?
            </p>
            <div class="mt-5 flex justify-between gap-2">
              <button
                id="deleteButton"
                class="from-accent to-accent-hover hover:bg-accent cursor-pointer rounded-md bg-linear-to-r px-12 py-1.5 text-white hover:bg-none"
              >
                Delete
              </button>
              <button
                id="cancelButton"
                class="border-accent text-accent hover:from-accent hover:to-accent-hover cursor-pointer rounded-md border px-12 hover:bg-linear-to-r hover:text-white"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
      <div
        class="my-10 flex w-full flex-col items-center justify-center gap-5 md:flex-row"
      >
        <div id="singleListingCard"></div>
        <div class="flex flex-col gap-5">
          <div id="bidOverview"></div>
          <div id="bidHistory"></div>
        </div>
      </div>
    </main>
    <footer class="bg-primary py-6 text-white">
      <div class="flex flex-col items-center text-center">
        <h3 class="mb-4 text-sm md:mb-6 md:text-base">CONTACT US</h3>
        <div
          class="text-cs flex flex-col items-center gap-2 md:flex-row md:gap-6"
        >
          <p class="mb-2 flex items-center gap-2 text-xs text-white md:text-sm">
            <i class="fa-solid fa-phone"></i>23 02 03 31
          </p>
          <p class="mb-2 flex items-center gap-2 text-xs text-white md:text-sm">
            <i class="fa-solid fa-envelope"></i>service@valorahouse.com
          </p>
          <p class="mb-2 flex items-center gap-2 text-xs text-white md:text-sm">
            <i class="fa-solid fa-location-dot"></i>Kongens gate 23, 0250 Oslo
          </p>
        </div>
        <img
          class="h-16 w-16 md:mt-4 md:h-20 md:w-20"
          alt="Valora-house logo"
          src="/images/logo-footer-black.png"
        />
      </div>
    </footer>
  </body>
</html>
